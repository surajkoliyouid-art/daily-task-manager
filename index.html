<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="description" content="Daily Task Manager – Organize your day efficiently with due dates and smart filtering.">
    <title>Daily Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <!-- Preconnect for performance (optional but clean) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container" data-theme="light">
        <!-- MAIN HEADER -->
        <header class="app-header">
            <div class="header-title-wrapper">
                <h1 class="app-title">📋 Daily Task Manager</h1>
            </div>
            <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Switch dark/light mode" title="Dark mode">
                <span class="toggle-icon">🌙</span>
            </button>
        </header>

        <!-- INPUT SECTION: Task field, due date, add button -->
        <section class="input-section" aria-label="Add new task">
            <div class="input-group">
                <input type="text" id="taskInput" class="task-input" placeholder="Write a task... e.g., 'Finish report'" autocomplete="off">
                <input type="date" id="dueDateInput" class="due-date-picker">
                <button id="addTaskBtn" class="add-task-btn">+ Add Task</button>
            </div>
        </section>

        <!-- FILTER BUTTONS: All, Completed, Pending -->
        <div class="filter-bar" role="tablist" aria-label="Task filters">
            <button class="filter-btn active-filter" data-filter="all" id="filterAll">All</button>
            <button class="filter-btn" data-filter="completed" id="filterCompleted">Completed</button>
            <button class="filter-btn" data-filter="pending" id="filterPending">Pending</button>
        </div>

        <!-- TASK LIST CONTAINER + EMPTY STATE MESSAGE -->
        <div class="task-list-wrapper">
            <ul id="taskList" class="task-list"></ul>
            <div id="emptyState" class="empty-state">
                <span class="empty-icon">📭</span>
                <p>No tasks yet. Add your first task above!</p>
            </div>
        </div>

        <!-- optional footer for extra polish (not required but enhances semantic flow) -->
        <footer class="app-footer">
            <p>✔️ Stay productive — tasks persist until you delete them</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
